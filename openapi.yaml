openapi: 3.1.0
info:
  title: Devices API
  version: 0.0.1-SNAPSHOT
  description: |
    Create, retrieve, filter, fully update, and delete devices.
    IDs and UTC creation times are generated by SQLite and are immutable.
    Partial updates (PATCH) are outside the current delivery.
    No authentication is required.
servers:
  - url: http://localhost:8080
    description: Local application
tags:
  - name: Devices
    description: Device lifecycle and queries
paths:
  /devices:
    post:
      tags: [Devices]
      operationId: createDevice
      summary: Create a device
      description: |
        All three mutable fields are required. Unknown properties, null mutable
        fields, blank names or brands, invalid states, and non-null client-supplied
        IDs or creation times return 400. Names and brands retain their whitespace.
      requestBody:
        $ref: '#/components/requestBodies/DeviceWrite'
      responses:
        '201':
          description: Device created with a database-generated ID and UTC creation time.
          headers:
            Location:
              description: Relative URI of the created device.
              required: true
              schema:
                type: string
                format: uri-reference
              example: /devices/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                created:
                  $ref: '#/components/examples/AvailableDevice'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List devices with optional brand and state filters
      description: |
        Returns all devices when neither filter is supplied. Supplied filters
        combine with AND. Brand matching is exact and case-sensitive, including
        whitespace. An empty brand is an exact filter, not an omitted filter.
        An empty database or no matches returns an empty array. Order is unspecified.
      parameters:
        - name: brand
          in: query
          required: false
          allowEmptyValue: true
          description: Exact, case-sensitive brand; whitespace is significant.
          schema:
            type: string
          examples:
            exact:
              value: Brand
            whitespace:
              value: ' Brand '
            empty:
              value: ''
        - name: state
          in: query
          required: false
          description: |
            Exact state value. Empty, blank, uppercase, numeric, and otherwise
            invalid supplied values return 400.
          schema:
            $ref: '#/components/schemas/DeviceState'
          example: available
      responses:
        '200':
          description: Matching devices in no guaranteed order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
              examples:
                matching:
                  value:
                    - id: 42
                      name: Phone
                      brand: Brand
                      state: available
                      creationTime: '2026-10-11T10:00:00Z'
                noMatches:
                  value: []
        '400':
          $ref: '#/components/responses/BadRequest'
  /devices/{id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDevice
      summary: Retrieve a device
      responses:
        '200':
          description: The persisted device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                available:
                  $ref: '#/components/examples/AvailableDevice'
                inUse:
                  $ref: '#/components/examples/InUseDevice'
                inactive:
                  $ref: '#/components/examples/InactiveDevice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Devices]
      operationId: updateDevice
      summary: Fully update a device
      description: |
        Replaces name, brand, and state; all three fields are required. ID and
        creation time remain unchanged. Unknown properties, null mutable fields,
        blank names or brands, invalid states, and non-null client-supplied IDs
        or creation times return 400.

        If the stored device is in-use and remains in-use, changing its name or
        brand returns 409. Repeating unchanged values is allowed. Changing its
        state to available or inactive in the same request allows name and brand
        changes. A rejected update leaves the stored device unchanged.

        Internal optimistic versioning detects stale writes, which return 409.
        Retry after retrieving current values. The version is not exposed in JSON.
      requestBody:
        $ref: '#/components/requestBodies/DeviceWrite'
      responses:
        '200':
          description: Updated device with its original ID and creation time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                releasedAndRenamed:
                  value:
                    id: 42
                    name: Tablet
                    brand: Other
                    state: inactive
                    creationTime: '2026-10-11T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Name or brand change while remaining in-use, or a concurrent write conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                inUse:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    detail: The name or brand of an in-use device cannot be changed
                    instance: /devices/42
                concurrentWrite:
                  $ref: '#/components/examples/ConcurrentWrite'
    delete:
      tags: [Devices]
      operationId: deleteDevice
      summary: Delete an eligible device
      description: |
        Deletes available or inactive devices. An in-use device returns 409 and
        remains stored. Deleting a missing device, including a previously deleted
        device, returns 404. A stale concurrent deletion returns 409.
      responses:
        '204':
          description: Device deleted; the response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Device is in-use, or a concurrent write conflict occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                inUse:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    detail: Device 42 is in use and cannot be deleted
                    instance: /devices/42
                concurrentWrite:
                  $ref: '#/components/examples/ConcurrentWrite'
components:
  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      description: |
        Device ID as a signed 64-bit integer. Generated IDs are positive.
        Non-integer values and values outside the signed 64-bit range return 400.
        Any valid integer with no corresponding device returns 404.
      schema:
        type: integer
        format: int64
        minimum: -9223372036854775808
        maximum: 9223372036854775807
      example: 42
  requestBodies:
    DeviceWrite:
      required: true
      description: Complete mutable device values for creation or full replacement.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceWrite'
          examples:
            available:
              value:
                name: Phone
                brand: Brand
                state: available
            inUse:
              value:
                name: Phone
                brand: Brand
                state: in-use
            inactive:
              value:
                name: Tablet
                brand: Other
                state: inactive
  schemas:
    DeviceState:
      type: string
      enum: [available, in-use, inactive]
      description: Exact JSON and query values; numeric enum values are rejected.
    DeviceWrite:
      type: object
      additionalProperties: false
      required: [name, brand, state]
      description: |
        Clients should send name and brand as nonblank strings. Their whitespace
        is preserved. Existing Jackson scalar-to-string conversion remains enabled;
        strict rejection of numeric and boolean name/brand inputs is not guaranteed.
        ID and creationTime may be omitted or explicitly null, but cannot be supplied
        with non-null values. Separate request and response schemas describe the
        same application DTO without suggesting generated fields can be written.
      properties:
        name:
          type: string
          minLength: 1
          description: Required nonblank name; whitespace-only values are rejected.
        brand:
          type: string
          minLength: 1
          description: Required nonblank brand; whitespace-only values are rejected.
        state:
          $ref: '#/components/schemas/DeviceState'
        id:
          type: 'null'
          description: May be omitted or null; non-null client-supplied IDs are rejected.
        creationTime:
          type: 'null'
          description: May be omitted or null; non-null client-supplied creation times are rejected.
    Device:
      type: object
      additionalProperties: false
      required: [id, name, brand, state, creationTime]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          readOnly: true
          description: Database-generated immutable integer ID.
        name:
          type: string
          minLength: 1
          description: Stored nonblank name, including supplied whitespace.
        brand:
          type: string
          minLength: 1
          description: Stored nonblank brand, including supplied whitespace.
        state:
          $ref: '#/components/schemas/DeviceState'
        creationTime:
          type: string
          format: date-time
          readOnly: true
          description: Database-generated immutable creation time, serialized in UTC with a Z suffix.
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      description: Problem Details error response. Framework-generated detail text may vary.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          enum: [400, 404, 409]
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
  responses:
    BadRequest:
      description: |
        Invalid request body, invalid state filter, or a non-integer or overflowing
        device ID. Errors use Problem Details; the detail text depends on the invalid input.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No device exists with the supplied integer ID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: about:blank
                title: Not Found
                status: 404
                detail: Device 42 not found
                instance: /devices/42
  examples:
    AvailableDevice:
      value:
        id: 42
        name: Phone
        brand: Brand
        state: available
        creationTime: '2026-10-11T10:00:00Z'
    InUseDevice:
      value:
        id: 42
        name: Phone
        brand: Brand
        state: in-use
        creationTime: '2026-10-11T10:00:00Z'
    InactiveDevice:
      value:
        id: 42
        name: Phone
        brand: Brand
        state: inactive
        creationTime: '2026-10-11T10:00:00Z'
    ConcurrentWrite:
      value:
        type: about:blank
        title: Conflict
        status: 409
        detail: Device was changed by another request; retry with its current values
        instance: /devices/42
